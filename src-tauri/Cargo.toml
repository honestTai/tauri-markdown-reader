[package]
name = "flowmark-windows"
version = "1.0.0"
description = "FlowMark Windows 桌面版"
authors = ["honest.tai"]
edition = "2021"
rust-version = "1.77"

# lib 名加 _lib 后缀避免在 Windows 上与 bin 名冲突
# 见 https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "flowmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 异步运行时（sidecar 通信、命令处理）
tokio = { version = "1", features = ["full"] }
# 日志
log = "0.4"
# 错误类型派生
thiserror = "1"
# 日志后端
env_logger = "0.11"
# 系统数据目录定位（AppData / Library / XDG）
dirs-next = "2"
# Windows Credential Manager / Keychain 凭据存储
keyring = "3"
# 临时目录（测试用）
tempfile = "3"
# SHA-256 内容指纹（阶段 3 索引用）
sha2 = "0.10"
# SQLite 索引存储（阶段 3）
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[features]
# 自定义 feature，用于在 dev 模式下跳过打包版 sidecar
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
